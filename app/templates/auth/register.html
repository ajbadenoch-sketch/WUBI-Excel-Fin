<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidaControl - Registro</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>VidaControl</h1>
            <p>Crea tu cuenta para comenzar</p>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" name="name" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Correo electronico</label>
                    <input type="email" name="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label>Contrasena</label>
                    <input type="password" name="password" required minlength="6" placeholder="Minimo 6 caracteres">
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" name="age" placeholder="51">
                    </div>
                    <div class="form-group">
                        <label>Estatura (m)</label>
                        <input type="number" step="0.01" name="height_m" placeholder="1.79">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                    Crear Cuenta
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem;">
                Ya tienes cuenta? <a href="/login">Inicia sesion</a>
            </p>
        </div>
    </div>
</body>
</html>
